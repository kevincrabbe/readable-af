name: Publish

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the release tag
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on npm; will publish."
          fi

      - name: Install dependencies
        if: steps.version.outputs.published == 'false'
        run: npm ci

      - name: Typecheck, test and lint
        if: steps.version.outputs.published == 'false'
        run: npm run check

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
